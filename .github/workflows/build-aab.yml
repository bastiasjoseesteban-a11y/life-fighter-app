name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Instalar dependencias
      run: npm ci
    - name: Generar capacitor.config.json
      run: |
        echo "=== Generando capacitor.config.json desde capacitor.config.ts ==="
        # Si necesitas TypeScript, instálalo
        npm install typescript --no-save
        # Genera el archivo JSON
        npx tsx -e "
          import config from './capacitor.config.ts';
          import { writeFileSync } from 'fs';
          writeFileSync('./capacitor.config.json', JSON.stringify(config, null, 2));
          console.log('✅ capacitor.config.json generado:', config);
        " || echo "⚠️  Usando método alternativo"
        
        # Método alternativo si falla TypeScript
        if [ ! -f "capacitor.config.json" ]; then
          echo "{\"appId\":\"com.esteban.lifefighter\",\"appName\":\"LifeFighter\",\"webDir\":\"out\"}" > capacitor.config.json
          echo "✅ capacitor.config.json creado manualmente"
        fi
        
        cat capacitor.config.json
    - name: Construir proyecto Next.js
      run: npm run build
    - name: Sincronizar Capacitor
      run: |
        echo "=== Sincronizando Capacitor ==="
        npx cap sync android
        echo ""
        echo "=== Verificando archivos generados ==="
        echo "settings.gradle:"
        cat android/settings.gradle
        echo ""
        echo "capacitor.settings.gradle:"
        cat android/capacitor.settings.gradle
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - name: Instalar Android SDK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/tools
        export PATH=$ANDROID_HOME/cmdline-tools/tools/bin:$PATH
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
    - name: Dar permisos a Gradle
      run: cd android && chmod +x gradlew
    - name: Compilar AAB
      working-directory: ./android
      run: ./gradlew :app:bundleRelease --stacktrace --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: lifefighter-aab
        path: android/app/build/outputs/bundle/release/*.aab
