name: 🚀 Build AAB para Google Play
on: workflow_dispatch

jobs:
  build-aab:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"
        cache: "npm"
    
    - name: 🔧 Instalar dependencias
      run: |
        npm ci
        npm install @capacitor/android@8.0.1 --save-exact
        
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        
    - name: 🤖 Setup Android
      uses: android-actions/setup-android@v3
      
    - name: 📝 Aceptar licencias
      run: |
        mkdir -p $HOME/.android/licenses
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $HOME/.android/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b04d79b0" >> $HOME/.android/licenses/android-sdk-license
        
    - name: 🔨 PREPARAR ANDROID (SIN BOM)
      run: |
        cd android
        printf '"'"'include '"'"':app'"'"'\n'"'"' > settings.gradle
        printf '"'"'include '"'"':capacitor-android'"'"'\n'"'"' >> settings.gradle
        printf '"'"'project('"'"':capacitor-android'"'"').projectDir = new File('"'"'../node_modules/@capacitor/android/capacitor'"'"')\n'"'"' >> settings.gradle
        echo "android.useAndroidX=true" > gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties
        
    - name: 🏗️ Build AAB
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew clean
        ./gradlew :app:bundleRelease --stacktrace --no-daemon
        
    - name: 📤 Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/*.aab
