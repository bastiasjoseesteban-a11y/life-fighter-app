name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
      
    - name: Clean gradle.properties
      run: |
        echo "=== Limpiando gradle.properties ==="
        cd android
        # Eliminar cualquier referencia a java.home
        sed -i '/org.gradle.java.home/d' gradle.properties
        # Asegurar configuraciones correctas
        echo "" >> gradle.properties
        echo "# Configurado automáticamente para GitHub Actions" >> gradle.properties
        echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
        echo "Contenido actualizado:"
        cat gradle.properties
      
    - name: Build AAB
      working-directory: ./android
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
      run: |
        chmod +x gradlew
        ./gradlew :app:bundleRelease --stacktrace
        
    - uses: actions/upload-artifact@v4
      with:
        name: lifefighter-aab
        path: android/app/build/outputs/bundle/release/*.aab
