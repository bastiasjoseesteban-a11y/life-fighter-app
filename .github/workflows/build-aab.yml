name: Build AAB para Google Play
on: 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install @capacitor/android@8.0.1 --save-exact

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: |
          mkdir -p ~/.android/licenses
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b04d79b0" >> ~/.android/licenses/android-sdk-license

      - name: Prepare Android
        run: |
          cd android
          rm -f settings.gradle gradle.properties
          echo "include ':app'" > settings.gradle
          echo "include ':capacitor-android'" >> settings.gradle
          echo "project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')" >> settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties

      - name: Build AAB
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew bundleRelease --no-daemon --no-parallel --stacktrace -x lint -x lintVitalRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab