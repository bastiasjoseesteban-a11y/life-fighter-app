name: Generate Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create basic web content
      run: |
        mkdir -p out
        echo "<html><body><h1>LifeFighter</h1><p>App en desarrollo</p></body></html>" > out/index.html
        echo "Basic web content created"
    
    - name: Setup Capacitor
      run: |
        echo "{\"appId\":\"com.esteban.lifefighter\",\"appName\":\"LifeFighter\",\"webDir\":\"out\"}" > capacitor.config.json
        npx cap init LifeFighter com.esteban.lifefighter --web-dir out
        npx cap add android
        npx cap sync android
    
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    
    - name: Setup Android SDK
      run: |
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses
        $ANDROID_HOME/tools/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
    
    - name: Build AAB
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew :app:bundleRelease --stacktrace
    
    - uses: actions/upload-artifact@v4
      with:
        name: app-aab
        path: android/app/build/outputs/bundle/release/*.aab
