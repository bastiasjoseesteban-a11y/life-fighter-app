name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: npm
    - name: Instalar dependencias
      run: npm ci
    - name: Verificar y sincronizar Capacitor
      run: |
        echo "=== Verificando estructura antes de sincronizar ==="
        ls -la node_modules/@capacitor/ 2>/dev/null || echo "Capacitor no instalado"
        echo ""
        echo "=== Instalando Capacitor si es necesario ==="
        npm install @capacitor/core @capacitor/cli @capacitor/android
        echo ""
        echo "=== Sincronizando Capacitor ==="
        npx cap sync android
        echo ""
        echo "=== Verificando settings.gradle ==="
        cat android/settings.gradle
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - name: Instalar Android SDK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/tools
        export PATH=$ANDROID_HOME/cmdline-tools/tools/bin:$PATH
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
    - name: Dar permisos a Gradle
      run: cd android && chmod +x gradlew
    - name: Compilar AAB
      working-directory: ./android
      run: ./gradlew :app:bundleRelease --stacktrace --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: lifefighter-aab
        path: android/app/build/outputs/bundle/release/*.aab
