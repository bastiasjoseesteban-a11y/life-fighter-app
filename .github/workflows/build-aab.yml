name: Build Android AAB
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Node dependencies
      run: |
        echo "=== Instalando dependencias Node ==="
        npm ci --legacy-peer-deps
        npm list @capacitor/android @capacitor/cli
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept Android licenses
      run: |
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
    
    - name: Prepare Android project
      run: |
        echo "=== Preparando proyecto Android ==="
        
        cd android
        
        # 1. FIX: Recrear settings.gradle CORRECTO
        echo "Recreando settings.gradle..."
        cat > settings.gradle << 'EOF'
        include ':app'
        include ':capacitor-android'
        
        project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
        
        // capacitor.settings.gradle solo incluye :capacitor-android
        EOF
        
        # 2. FIX: Recrear gradle.properties CORRECTO
        echo "Recreando gradle.properties..."
        cat > gradle.properties << 'EOF'
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        android.enableAapt2Daemon=false
        android.enableR8=true
        # NO configurar org.gradle.java.home aquí
        EOF
        
        # 3. Verificar estructura
        echo "=== Verificación ==="
        echo "settings.gradle:"
        cat settings.gradle
        echo ""
        echo "gradle.properties:"
        cat gradle.properties
        
        # 4. Verificar que existe node_modules
        echo "Verificando Capacitor..."
        ls -la ../node_modules/@capacitor/android/ || echo "⚠️  Capacitor no encontrado"
    
    - name: Grant execute permission for gradlew
      run: |
        cd android
        chmod +x gradlew
        ./gradlew --version
    
    - name: Build AAB (Release)
      working-directory: ./android
      run: |
        echo "=== Construyendo AAB ==="
        
        # Limpiar primero
        ./gradlew clean
        
        # Construir AAB con información detallada
        ./gradlew :app:bundleRelease \
          --stacktrace \
          --no-daemon \
          --info \
          --warning-mode=all
        
        # Verificar que se creó el AAB
        echo "=== Verificando artefactos ==="
        ls -la app/build/outputs/bundle/release/
    
    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: lifefighter-aab
        path: android/app/build/outputs/bundle/release/*.aab
        retention-days: 7
        if-no-files-found: error
