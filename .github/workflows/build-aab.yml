name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Aceptar licencias de Android SDK
      run: |
        yes | /tools/bin/sdkmanager --licenses || true
        /tools/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0"
        
    - name: Dar permisos y configurar Gradle
      run: |
        cd android
        chmod +x gradlew
        echo "android.useAndroidX=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties
        echo "android.enableAapt2Daemon=false" >> gradle.properties
        cd ..
        
    - name: Compilar AAB
      working-directory: ./android
      run: |
        ./gradlew :app:bundleRelease --no-daemon --stacktrace
        
    - name: Subir AAB como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: lifefighter-aab
        path: android/app/build/outputs/bundle/release/*.aab
        retention-days: 1
