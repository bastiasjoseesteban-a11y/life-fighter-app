name: Build AAB para Google Play
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Aceptar licencias Android
      run: |
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses
        
    - name: Preparar proyecto Android
      run: |
        cd android
        
        echo "include ':app'" > settings.gradle
        echo "include ':capacitor-android'" >> settings.gradle
        echo "project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')" >> settings.gradle
        
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties
        
    - name: Construir AAB
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew clean
        ./gradlew bundleRelease --stacktrace --no-daemon
        
    - name: Subir AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/*.aab