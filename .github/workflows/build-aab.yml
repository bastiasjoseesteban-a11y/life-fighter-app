name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    - name: Configurar JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: temurin
    - name: Instalar Android SDK manualmente
      run: |
        # Crear directorio para Android SDK
        mkdir -p $ANDROID_HOME
        # Descargar command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/tools
        # Añadir a PATH
        echo "$ANDROID_HOME/cmdline-tools/tools/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        # Aceptar licencias
        yes | sdkmanager --licenses
        # Instalar componentes necesarios
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
        sdkmanager --update
    - name: Dar permisos a Gradle
      run: |
        cd android
        chmod +x gradlew
    - name: Configurar propiedades de Gradle
      run: |
        cd android
        echo "android.useAndroidX=true" > gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties
        echo "android.enableAapt2Daemon=false" >> gradle.properties
    - name: Compilar AAB
      working-directory: ./android
      run: |
        ./gradlew :app:bundleRelease --no-daemon --stacktrace
    - name: Subir AAB como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: lifefighter-aab
        path: android/app/build/outputs/bundle/release/*.aab
        retention-days: 1
