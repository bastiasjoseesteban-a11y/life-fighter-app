name: Build Android AAB

on:
  workflow_dispatch:  # Solo manual por ahora

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          android/
          .github/
        sparse-checkout-cone-mode: false
      
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Dar permisos a Gradle
      run: |
        cd android
        chmod +x gradlew
        cd ..
        
    - name: Configurar entorno Android
      run: |
        cd android
        # Configuraciones críticas para evitar errores
        echo "android.useAndroidX=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties
        echo "android.enableAapt2Daemon=false" >> gradle.properties
        cd ..
        
    - name: Compilar AAB
      working-directory: ./android
      run: |
        ./gradlew :app:bundleRelease --no-daemon --stacktrace --warning-mode all
        
    - name: Subir AAB como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: lifefighter-aab
        path: android/app/build/outputs/bundle/release/*.aab
        retention-days: 1
