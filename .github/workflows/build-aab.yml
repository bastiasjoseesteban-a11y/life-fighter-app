name: Build AAB para Google Play
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: "18"
        cache: "npm"

    - name: Instalar dependencias Node
      run: |
        npm ci
        npm install @capacitor/android@8.0.1 --save-exact

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Aceptar licencias Android
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.android/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b04d79b0" >> ~/.android/licenses/android-sdk-license

    - name: Preparar proyecto Android
      run: |
        cd android
        echo "include ':app'" > settings.gradle
        echo "include ':capacitor-android'" >> settings.gradle
        echo "project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')" >> settings.gradle
        echo "android.useAndroidX=true" > gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties
        echo "=== Verificando capacitor ==="
        ls -la "../node_modules/@capacitor/android/capacitor/" || echo "⚠️  No se encontró capacitor"

    - name: Construir AAB
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew clean
        ./gradlew bundleRelease --stacktrace --no-daemon

    - name: Subir AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/*.aab
