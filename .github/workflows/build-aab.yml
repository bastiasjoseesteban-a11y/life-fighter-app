name: Generate Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    
    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli @capacitor/core @capacitor/android
    
    - name: Create basic web content
      run: |
        mkdir -p out
        echo "<html><body><h1>LifeFighter</h1><p>App en desarrollo</p></body></html>" > out/index.html
        echo "Basic web content created"
    
    - name: Setup Capacitor project
      run: |
        echo "Creating capacitor.config.json"
        echo '{"appId":"com.esteban.lifefighter","appName":"LifeFighter","webDir":"out"}' > capacitor.config.json
        npx cap init LifeFighter com.esteban.lifefighter --web-dir out
        npx cap add android
        npx cap sync android
    
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    
    - name: Setup Android SDK
      run: |
        # Asegurarse de que ANDROID_HOME está configurado
        export ANDROID_HOME=$HOME/android-sdk
        if [ ! -d "$ANDROID_HOME" ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/tools
        fi
        export PATH=$ANDROID_HOME/cmdline-tools/tools/bin:$PATH
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
    
    - name: Build AAB
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew :app:bundleRelease --stacktrace
    
    - uses: actions/upload-artifact@v4
      with:
        name: app-aab
        path: android/app/build/outputs/bundle/release/*.aab
